# Tool configuration only; the service is deployed from requirements.txt.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:setDaemon\\(\\) is deprecated:DeprecationWarning"]

[tool.coverage.run]
source = ["chartsvc"]
omit = ["chartsvc/__main__.py", "chartsvc/wsgi.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "UP006", "UP007", "UP035", "UP045", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
